<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fábrica de Posts" />
    <title>Fábrica de Posts Infinitos</title>
    <meta name="theme-color" content="#090D16" />
    <meta
      name="description"
      content="Estudio visual para componer posts de Facebook a tamaño nativo: 1080×1080, 4:5 y 1.91:1."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="studio">
      <header class="topbar">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="1.5" y="1.5" width="20" height="20" rx="3.5" stroke="currentColor" stroke-width="1.5" />
          <rect x="10.5" y="10.5" width="20" height="20" rx="3.5" stroke="currentColor" stroke-width="1.5" />
          <rect x="22" y="4" width="6" height="6" fill="var(--accent)" />
        </svg>
        <div class="brand">
          <p class="kicker">Estudio visual</p>
          <h1>Fábrica de Posts Infinitos</h1>
        </div>
        <p class="format-chip" id="formatChip">1080 × 1080</p>
        <button class="btn btn-outline btn-sm hide-sm" id="copyPngBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          Copiar
        </button>
        <button class="btn btn-accent" id="exportBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3v12" />
            <path d="m7 11 5 5 5-5" />
            <path d="M5 21h14" />
          </svg>
          <span id="exportLabel">Descargar PNG</span>
        </button>
      </header>

      <div class="workspace">
        <aside class="rail rail-left" id="sidebar"></aside>
        <main class="stage-wrap" id="stagePanel">
          <div class="size-container">
            <div class="stage" id="stage" data-canvas-stage="true">
              <div id="stageFill"></div>
              <div class="scrim" id="scrim"></div>
              <div class="gradient" id="gradient"></div>
              <div class="guides" id="guides"></div>
              <div id="layers"></div>
            </div>
            <span class="crop top left"></span>
            <span class="crop top right"></span>
            <span class="crop bottom left"></span>
            <span class="crop bottom right"></span>
          </div>
          <div class="meta" id="meta"></div>
        </main>
        <aside class="rail rail-right" id="inspector"></aside>
      </div>

      <nav class="mobile-nav" aria-label="Secciones">
        <button type="button" data-tab="canvas" class="is-active">Lienzo</button>
        <button type="button" data-tab="source">Imagen</button>
        <button type="button" data-tab="type">Texto</button>
      </nav>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <input id="fileInput" class="sr-only" type="file" accept="image/*" />

    <noscript>
      <p class="noscript">Activa JavaScript para usar el estudio.</p>
    </noscript>
    <script src="./js/app.js"></script>
  </body>
</html>
